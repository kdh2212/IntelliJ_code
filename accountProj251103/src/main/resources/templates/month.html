<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>월별 통계 - MyWallet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-success" href="/index">💰 MyWallet</a>
    <div class="navbar-nav">
      <a class="nav-link" href="/index">지출 내역</a>
      <a class="nav-link active" href="/month.html">월별 통계</a>
      <a class="nav-link" href="/review.html">맛집 리뷰</a>
    </div>
  </div>
</nav>

<div class="container py-5">
  <h2 class="mb-4 fw-bold text-center">📊 월별 지출 통계</h2>
  <canvas id="expenseChart" height="100"></canvas>
</div>

<script>


  async function loadMonthlySummary() {
    // const res = await fetch(`/expenses/user/${userId}/summary`);
    const res = await fetch(`/expenses/summary`);
    const data = await res.json();

    const labels = data.map(row => row[0]);  // 예: "2025-10"
    const values = data.map(row => row[1]);  // 예: 12000

    const ctx = document.getElementById('expenseChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: '월별 총 지출 (원)',
          data: values,
          borderWidth: 1,
          backgroundColor: 'rgba(75, 192, 192, 0.5)'
        }]
      },
      options: {
        scales: {
          y: { beginAtZero: true, title: { display: true, text: '지출 금액 (원)' } },
          x: { title: { display: true, text: '월' } }
        }
      }
    });
  }

  loadMonthlySummary();
</script>
</body>
</html>
